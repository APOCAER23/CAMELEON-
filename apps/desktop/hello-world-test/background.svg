<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c"/>
      <stop offset="50%" style="stop-color:#b21f1f"/>
      <stop offset="100%" style="stop-color:#fdbb2d"/>
    </linearGradient>
    <linearGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff7ca"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" style="stop-color:#fff9d6; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0a500; stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Ciel dégradé -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Soleil -->
  <circle cx="1200" cy="220" r="110" fill="url(#sunGrad)"/>

  <!-- Nuages -->
  <g fill="#ffffff" opacity="0.25">
    <ellipse cx="300" cy="160" rx="160" ry="55"/>
    <ellipse cx="380" cy="130" rx="110" ry="40"/>
    <ellipse cx="230" cy="140" rx="90" ry="35"/>
    <ellipse cx="1050" cy="100" rx="140" ry="45"/>
    <ellipse cx="1130" cy="75" rx="95" ry="32"/>
    <ellipse cx="980" cy="85" rx="80" ry="28"/>
  </g>

  <!-- Montagnes lointaines -->
  <g fill="#3a3a5c" opacity="0.5">
    <polygon points="0,1000 0,700 250,480 500,700 780,500 1050,720 1300,560 1600,780 1600,1000"/>
  </g>

  <!-- Montagnes avant -->
  <g fill="#24243e" opacity="0.8">
    <polygon points="0,1000 0,820 200,620 420,800 700,600 960,820 1180,660 1400,820 1600,700 1600,1000"/>
  </g>

  <!-- Sol -->
  <rect y="900" width="1600" height="100" fill="#1a2a3a" opacity="0.6"/>
</svg>
